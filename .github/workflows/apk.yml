name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Remover créditos antigos
        shell: bash
        run: |
          find HSHPDF-Android -type f \( -name '*.kt' -o -name '*.kts' -o -name '*.xml' -o -name '*.md' \) -print0 | xargs -0 sed -i '/assistente de IA/d'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HSHPDF-Android
          git diff --cached --quiet || (git commit -m "Remove créditos antigos do projeto" && git push)

      - name: Compilar APK
        working-directory: HSHPDF-Android
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HSHPDF-V5-apk
          path: HSHPDF-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
